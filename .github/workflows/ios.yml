name: ios

# While this repo is PUBLIC, macOS runner minutes are free, so the simulator suite runs on every
# push. If it is ever made private again: free plan = 2000 minutes/month with macOS billed at a
# 10x multiplier (~200 real macOS minutes), a full run costs ~12 min and a build-only run ~2 min —
# in that case re-add `if: github.event_name == 'schedule' || inputs.full_tests == true` to the
# "Unit tests" step and flip `full_tests` on when you need the whole suite.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      full_tests:
        description: "Run the simulator test suite (costs ~10 extra macOS minutes)"
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * 0"

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Regression audit (known bug classes)
        run: python3 tools/audit.py ios

      - name: Install XcodeGen
        run: brew install xcodegen

      # Kokoro v1.1-zh (int8) for sherpa-onnx: the bundled Chinese voice. Pinned by checksum; only the
      # files the lexicon voice reads are kept (espeak-ng-data is ignored since sherpa-onnx 2.0).
      - name: Fetch the bundled voice
        run: |
          set -euo pipefail
          url=https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_1.tar.bz2
          curl -sSL --retry 3 -o "$RUNNER_TEMP/kokoro.tar.bz2" "$url"
          echo "259c9c8bc906d6078e4e0570421885dabb68b539c2f970fcbb890a58eeaf3e9c  $RUNNER_TEMP/kokoro.tar.bz2" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/kokoro"
          tar xjf "$RUNNER_TEMP/kokoro.tar.bz2" -C "$RUNNER_TEMP/kokoro"
          src=$(dirname "$(find "$RUNNER_TEMP/kokoro" -name model.int8.onnx | head -1)")
          dst=ios/Resources/kokoro
          mkdir -p "$dst"
          for f in model.int8.onnx voices.bin tokens.txt lexicon-us-en.txt lexicon-zh.txt phone-zh.fst date-zh.fst number-zh.fst LICENSE; do
            cp "$src/$f" "$dst/"
          done
          cp -R "$src/dict" "$dst/"
          du -sh "$dst"

      - name: Generate project
        run: cd ios && xcodegen generate

      - name: Unit tests (golden vectors)
        run: |
          cd ios
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+( Pro)?' | head -1)
          echo "simulator: $DEVICE"
          xcodebuild test \
            -project GlassesLink.xcodeproj \
            -scheme GlassesLink \
            -only-testing:GlassesLinkTests/ProtocolTests \
            -only-testing:GlassesLinkTests/CompatibilityTests \
            -only-testing:GlassesLinkTests/MediaWiFiTests \
            -only-testing:GlassesLinkTests/AssistantAudioTests \
            -only-testing:GlassesLinkTests/LiveTests \
            -only-testing:GlassesLinkTests/LogStoreTests \
            -only-testing:GlassesLinkTests/SessionLoopbackTests/testLoopbackPipeDeliversAFrame \
            -only-testing:GlassesLinkTests/SessionLoopbackTests/testFrameLengthWithPartialHeadersAndNonzeroStartIndex \
            -only-testing:GlassesLinkTests/SessionLoopbackTests/testLoopbackPipeKeepsTrailingPartialFrame \
            -only-testing:GlassesLinkTests/SessionLoopbackTests/testTransportReportsUnexpectedEndOnceAndPreservesItsCause \
            -only-testing:GlassesLinkTests/SessionLoopbackTests/testTransportReadsLargestDocumentedDataXFrameAcrossReads \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned
        run: |
          cd ios
          xcodebuild \
            -project GlassesLink.xcodeproj \
            -scheme GlassesLink \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/GlassesLink.app out/Payload/
          cd out && zip -qry GlassesLink.ipa Payload && ls -lh GlassesLink.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GlassesLink-ipa
          path: out/GlassesLink.ipa
          retention-days: 14
