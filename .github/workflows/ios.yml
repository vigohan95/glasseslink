name: ios

# Private repos are billed: free plan = 2000 minutes/month, and macOS is charged at a 10x
# multiplier, i.e. ~200 real macOS minutes. A full run with the simulator suite costs ~12 min,
# a build-only run costs ~2 min. So: every push builds (fast, cheap), the simulator suite runs
# on demand and once a week. Flip `full_tests` to true when you need the whole thing.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
    inputs:
      full_tests:
        description: "Run the simulator test suite (costs ~10 extra macOS minutes)"
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * 0"

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Regression audit (known bug classes)
        run: python3 tools/audit.py ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd ios && xcodegen generate

      - name: Unit tests (golden vectors)
        if: github.event_name == 'schedule' || inputs.full_tests == true
        run: |
          cd ios
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone [0-9]+( Pro)?' | head -1)
          echo "simulator: $DEVICE"
          xcodebuild test \
            -project GlassesLink.xcodeproj \
            -scheme GlassesLink \
            -only-testing:GlassesLinkTests/ProtocolTests \
            -only-testing:GlassesLinkTests/CompatibilityTests \
            -only-testing:GlassesLinkTests/SessionLoopbackTests/testLoopbackPipeDeliversAFrame \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Build unsigned
        run: |
          cd ios
          xcodebuild \
            -project GlassesLink.xcodeproj \
            -scheme GlassesLink \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Package ipa
        run: |
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/GlassesLink.app out/Payload/
          cd out && zip -qry GlassesLink.ipa Payload && ls -lh GlassesLink.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: GlassesLink-ipa
          path: out/GlassesLink.ipa
          retention-days: 14
