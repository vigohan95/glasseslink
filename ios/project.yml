name: GlassesLink
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  GlassesLink:
    type: application
    platform: iOS
    sources:
      - App.swift
      - RootView.swift
      - AlbumMediaView.swift
      - AudioOutput.swift
      - MicrophoneCheckView.swift
      - SpokenQuestionView.swift
      - LocalMediaLibrary.swift
      - ModelClient.swift
      - ModelSheet.swift
      - AboutView.swift
      - AirShield.swift
      - OwnerKey.swift
      - Session.swift
      - MediaWiFiProtocol.swift
      - MediaWiFiTransport.swift
      - Shutter.swift
      - P256.swift
      - SelfTest.swift
      - SelfTestView.swift
      - CrashLog.swift
      - LogStore.swift
      - ScanEntry.swift
      - Varm.swift
      - Provision.swift
      - Login.swift
      - Drive.swift
      - SettingsCatalog.swift
      - SettingsView.swift
      - Status.swift
      - Live.swift
      - LiveView.swift
      - GlassesSettingsView.swift
      - PhotoLeveling.swift
      - Thrift.swift
      - Assistant.swift
      - SettingsSchema.swift
      - Resources/settings_ui.json
      - Resources/settings.tsv
      - Resources/varm_template.bin
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.glasseslink
        PRODUCT_NAME: GlassesLink
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_ENTITLEMENTS: GlassesLink.entitlements
        ENABLE_BITCODE: NO
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GlassesLink
        CFBundleShortVersionString: "1.02"
        CFBundleVersion: "102"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSBluetoothAlwaysUsageDescription: 连接你的眼镜，走本地蓝牙链路，不经 Meta 云。
        NSMicrophoneUsageDescription: 在你主动发起语音提问或麦克风测试时使用你选择的麦克风。
        NSSpeechRecognitionUsageDescription: 将你主动录制的问题在 iPhone 上转写，确认后可发送文字给选定的模型。
        NSLocalNetworkUsageDescription: 通过眼镜 Wi-Fi 导入照片和视频，以及连接你配置的局域网模型或桥接服务。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSPhotoLibraryAddUsageDescription: 把眼镜拍的照片存到你的相册。
        NSPhotoLibraryUsageDescription: 选择并查看眼镜拍的照片。
        UIBackgroundModes:
          - bluetooth-central
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  GlassesLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: GlassesLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.glasseslink.tests
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: 1

schemes:
  GlassesLink:
    build:
      targets:
        GlassesLink: all
        GlassesLinkTests: [test]
    run:
      config: Release
    test:
      config: Release
      targets:
        - GlassesLinkTests
