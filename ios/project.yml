name: GlassesLink
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  GlassesLink:
    type: application
    platform: iOS
    sources:
      - App.swift
      - AirShield.swift
      - OwnerKey.swift
      - Session.swift
      - Shutter.swift
      - P256.swift
      - SelfTest.swift
      - SelfTestView.swift
      - ScanEntry.swift
      - Varm.swift
      - Provision.swift
      - Login.swift
      - Drive.swift
      - SettingsCatalog.swift
      - SettingsView.swift
      - Status.swift
      - Live.swift
      - LiveView.swift
      - QuickPanel.swift
      - Thrift.swift
      - Assistant.swift
      - SettingsSchema.swift
      - Resources/settings_ui.json
      - Resources/settings.tsv
      - Resources/varm_template.bin
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.glasseslink
        PRODUCT_NAME: GlassesLink
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
        ENABLE_TESTABILITY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GlassesLink
        CFBundleShortVersionString: "0.39"
        CFBundleVersion: "39"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSBluetoothAlwaysUsageDescription: 连接你的眼镜，走本地蓝牙链路，不经 Meta 云。
        NSLocalNetworkUsageDescription: 访问局域网内的桥接服务。
        NSPhotoLibraryAddUsageDescription: 把眼镜拍的照片存到你的相册。
        NSPhotoLibraryUsageDescription: 选择并查看眼镜拍的照片。
        UIBackgroundModes:
          - bluetooth-central
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  GlassesLinkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: GlassesLink
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.glasseslink.tests
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        TARGETED_DEVICE_FAMILY: 1

schemes:
  GlassesLink:
    build:
      targets:
        GlassesLink: all
        GlassesLinkTests: [test]
    run:
      config: Release
    test:
      config: Release
      targets:
        - GlassesLinkTests
