name: GlassesLink
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  GlassesLink:
    type: application
    platform: iOS
    sources:
      - App.swift
      - AirShield.swift
      - OwnerKey.swift
      - Session.swift
      - Provision.swift
      - Login.swift
      - Drive.swift
      - SettingsCatalog.swift
      - SettingsView.swift
      - Status.swift
      - SettingsSchema.swift
      - Resources/settings_ui.json
      - Resources/settings.tsv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.glasseslink
        PRODUCT_NAME: GlassesLink
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_BITCODE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GlassesLink
        CFBundleShortVersionString: "0.6"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
